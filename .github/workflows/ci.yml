# STRETCH GOAL 3: GitHub Actions workflow that runs pytest and ruff on every pull request.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # Exit code 5 means "no tests collected" (true on main before the first feature branch).
        run: python -m pytest || [ $? -eq 5 ]
